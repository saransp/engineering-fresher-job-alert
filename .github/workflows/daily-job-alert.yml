name: Daily Engineering Fresher Job Alert

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"
      timezone: "Asia/Kolkata"

permissions:
  contents: write

concurrency:
  group: daily-engineering-fresher-alert
  cancel-in-progress: false

jobs:
  job-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Generate and send job alert
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: placement@ksrct.ac.in
        run: python job_alert.py

      - name: Commit updated state
        run: |
          if git diff --quiet -- state/job_state.json; then
            echo "No state changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/job_state.json
          git commit -m "chore: update job alert state"
          git push

name: Daily Engineering Fresher Job Alert

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"
      timezone: "Asia/Kolkata"

permissions:
  contents: read

concurrency:
  group: daily-engineering-fresher-alert
  cancel-in-progress: false

jobs:
  job-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Restore job alert state
        uses: actions/cache@v5
        with:
          path: state/job_state.json
          key: job-alert-state-${{ github.run_id }}
          restore-keys: |
            job-alert-state-

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Generate and send job alert
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: placement@ksrct.ac.in
        run: python job_alert.py
